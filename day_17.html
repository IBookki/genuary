<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genuary - Day 17: Wallpaper group</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      function setup() {
        createCanvas(800, 800);
      }

      function draw() {
        background(255);

        // Create a wallpaper pattern using p1 symmetry (translation only)
        let tileSize = 60;

        for (let x = 0; x < width; x += tileSize) {
          for (let y = 0; y < height; y += tileSize) {
            // Offset every other row for pattern
            let offsetX = (y / tileSize) % 2 === 0 ? 0 : tileSize / 2;
            drawTile(x + offsetX, y, tileSize);
          }
        }
      }

      function drawTile(x, y, size) {
        push();
        translate(x, y);

        // Draw hexagonal pattern
        stroke(0);
        strokeWeight(2);
        fill(255, 200, 200, 100);

        // Center circle
        circle(size / 2, size / 2, size * 0.4);

        // Surrounding pattern
        for (let i = 0; i < 6; i++) {
          let angle = (TWO_PI / 6) * i;
          let px = size / 2 + cos(angle) * size * 0.35;
          let py = size / 2 + sin(angle) * size * 0.35;
          circle(px, py, size * 0.2);
        }

        // Decorative lines
        stroke(100);
        strokeWeight(1);
        for (let i = 0; i < 6; i++) {
          let angle = (TWO_PI / 6) * i;
          let px = size / 2 + cos(angle) * size * 0.35;
          let py = size / 2 + sin(angle) * size * 0.35;
          let angle2 = angle + PI / 6;
          let px2 = size / 2 + cos(angle2) * size * 0.35;
          let py2 = size / 2 + sin(angle2) * size * 0.35;
          line(px, py, px2, py2);
        }

        pop();
      }
    </script>
  </body>
</html>
