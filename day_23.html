<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genuary - Day 23: Transparency</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      function setup() {
        createCanvas(800, 800);
      }

      function draw() {
        background(20);

        // Create overlapping transparent shapes
        for (let i = 0; i < 10; i++) {
          let x = width / 2 + cos((frameCount + i * 36) * 0.01) * 200;
          let y = height / 2 + sin((frameCount + i * 36) * 0.01) * 200;

          let hue = (frameCount + i * 25) % 360;
          colorMode(HSB);
          fill(hue, 255, 255, 60);

          circle(x, y, 150);
        }

        // Transparent rectangles
        colorMode(HSB);
        for (let i = 0; i < 5; i++) {
          let x = (frameCount + i * 100) % (width + 200);
          let y = (frameCount * 0.5 + i * 160) % (height + 200);
          let hue = (i * 70) % 360;

          fill(hue, 200, 200, 40);
          rect(x, y, 200, 200);
        }

        // Transparent lines creating patterns
        colorMode(RGB);
        stroke(100, 200, 255, 80);
        strokeWeight(2);

        for (let i = 0; i < 20; i++) {
          let x1 = (frameCount * 0.5 + i * 40) % width;
          let y1 = random(height);
          let x2 = (frameCount * 0.3 + i * 60) % width;
          let y2 = random(height);

          line(x1, y1, x2, y2);
        }

        // Title
        fill(255);
        textSize(24);
        text("Transparency", 20, 40);
      }
    </script>
  </body>
</html>
