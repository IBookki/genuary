<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genuary - Day 16: Order and disorder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      let particles = [];
      let orderAmount = 0;

      function setup() {
        createCanvas(800, 800);

        // Initialize particles
        for (let i = 0; i < 200; i++) {
          particles.push({
            x: random(width),
            y: random(height),
            vx: random(-2, 2),
            vy: random(-2, 2),
            gridX: floor(random(8)),
            gridY: floor(random(8)),
          });
        }
      }

      function draw() {
        background(20);

        orderAmount = (sin(frameCount * 0.01) + 1) / 2;

        for (let p of particles) {
          // Order: move to grid position
          let targetX = p.gridX * (width / 8) + width / 16;
          let targetY = p.gridY * (height / 8) + height / 16;

          // Disorder: move randomly
          if (random() < 1 - orderAmount) {
            p.x += random(-5, 5);
            p.y += random(-5, 5);
          } else {
            p.x += (targetX - p.x) * 0.05;
            p.y += (targetY - p.y) * 0.05;
          }

          // Wrap around
          p.x = (p.x + width) % width;
          p.y = (p.y + height) % height;

          // Draw particle
          fill(100 + orderAmount * 155);
          circle(p.x, p.y, 5);
        }

        // Draw grid during order
        if (orderAmount > 0.3) {
          stroke(255, orderAmount * 100);
          strokeWeight(1);
          for (let i = 0; i <= 8; i++) {
            line(i * (width / 8), 0, i * (width / 8), height);
            line(0, i * (height / 8), width, i * (height / 8));
          }
        }

        // Info
        fill(255);
        textSize(16);
        text("Order: " + nf(orderAmount, 1, 2), 20, 30);
      }
    </script>
  </body>
</html>
