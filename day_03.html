<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genuary - Day 3: Fibonacci forever</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      function fibonacci(n) {
        if (n <= 1) return n;
        return fibonacci(n - 1) + fibonacci(n - 2);
      }

      function setup() {
        createCanvas(800, 800);
      }

      function draw() {
        background(255);
        fill(0);
        noStroke();

        let x = 100;
        let y = height / 2;

        for (let i = 1; i < 10; i++) {
          let size = fibonacci(i) * 3;
          circle(x, y, size);
          x += size + 10;
          if (x > width - 50) {
            x = 100;
            y += 150;
          }
        }
      }
    </script>
  </body>
</html>
