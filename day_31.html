<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genuary - Day 31: GLSL day - Shaders</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script>
      const canvas = document.getElementById("canvas");
      const gl = canvas.getContext("webgl");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      if (!gl) {
        document.body.innerHTML = "WebGL not supported";
      }

      // Vertex shader
      const vertexShader = `
            attribute vec2 position;
            void main() {
                gl_Position = vec4(position, 0.0, 1.0);
            }
        `;

      // Fragment shader - GLSL masterpiece
      const fragmentShader = `
            precision highp float;
            uniform vec2 resolution;
            uniform float time;

            void main() {
                vec2 uv = gl_FragCoord.xy / resolution.xy;
                
                // Create multiple layers of patterns
                float pattern = sin(uv.x * 10.0 + time) * cos(uv.y * 10.0 - time);
                
                // Circular gradient
                vec2 center = vec2(0.5, 0.5);
                float dist = length(uv - center);
                float circle = sin(dist * 20.0 - time) / (dist + 0.5);
                
                // Combination
                float value = pattern + circle;
                value = sin(value * 3.14159) * 0.5 + 0.5;
                
                // Create rainbow effect
                float r = sin(uv.x * 5.0 + time) * 0.5 + 0.5;
                float g = sin(uv.y * 5.0 + time * 0.7) * 0.5 + 0.5;
                float b = sin((uv.x + uv.y) * 5.0 - time * 0.5) * 0.5 + 0.5;
                
                gl_FragColor = vec4(r * value, g * value, b * value, 1.0);
            }
        `;

      // Compile shader
      function compileShader(source, type) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        return shader;
      }

      // Create program
      const program = gl.createProgram();
      gl.attachShader(program, compileShader(vertexShader, gl.VERTEX_SHADER));
      gl.attachShader(
        program,
        compileShader(fragmentShader, gl.FRAGMENT_SHADER)
      );
      gl.linkProgram(program);
      gl.useProgram(program);

      // Set up vertices
      const vertices = new Float32Array([-1, -1, 1, -1, 1, 1, -1, 1]);

      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

      const positionAttrib = gl.getAttribLocation(program, "position");
      gl.enableVertexAttribArray(positionAttrib);
      gl.vertexAttribPointer(positionAttrib, 2, gl.FLOAT, false, 0, 0);

      // Get uniform locations
      const resolutionUniform = gl.getUniformLocation(program, "resolution");
      const timeUniform = gl.getUniformLocation(program, "time");

      // Render loop
      function render() {
        const time = performance.now() / 1000;

        gl.uniform2f(resolutionUniform, canvas.width, canvas.height);
        gl.uniform1f(timeUniform, time);

        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLE_FAN, 0, 4);

        requestAnimationFrame(render);
      }

      render();

      // Handle window resize
      window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gl.viewport(0, 0, canvas.width, canvas.height);
      });
    </script>
  </body>
</html>
