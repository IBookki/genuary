<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genuary - Day 4: Lowres</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      let pixelSize = 10;

      function setup() {
        createCanvas(800, 800);
        pixelDensity(1);
      }

      function draw() {
        background(255);
        fill(0);
        noStroke();

        let x = 100;
        let y = height / 2;

        for (let i = 1; i < 10; i++) {
          let size = i * 2 * pixelSize;
          rect(x, y, size, size);
          x += size + pixelSize;
          if (x > width - 50) {
            x = 100;
            y += 150;
          }
        }
      }
    </script>
  </body>
</html>
